[project]
name = "ehall"
version = "0.1.0"
description = "复旦校园自动化工具集：UIS登录、API封装、自动化脚本、MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "parsel",
    "python-dotenv",
    "pycryptodome>=3.23.0",
    "pyotp",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
# Phase 3: MCP Server
mcp = [
    "mcp",
    "uvicorn",
    "playwright>=1.58.0",   # 无头 Chrome 解瑞数 WAF 质询
    "rookiepy>=0.5.6",      # 兜底：读本机 Chrome 的 WAF cookie
]

[project.scripts]
fudan-mcp = "mcp_server.server:app.run"

[dependency-groups]
dev = [
    "nodriver>=0.50.3",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "pytest",
    "rookiepy>=0.5.6",
]
